<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusMobile - AI Compliance & Brand Auditor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState("compliance"); // "compliance" or "brand"
      const [complianceReport, setComplianceReport] = useState(null);
      const [brandReport, setBrandReport] = useState(null);
      const [error, setError] = useState(null);

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          setFile(e.target.files[0]);
          setComplianceReport(null);
          setBrandReport(null);
          setError(null);
        }
      };

      const runAudit = async () => {
        if (!file) {
          setError("Please select a PDF document first.");
          return;
        }

        setLoading(true);
        setError(null);

        const formData = new FormData();
        formData.append("file", file);

        try {
          // Trigger both Compliance and Brand Audit concurrently
          const [complianceRes, brandRes] = await Promise.all([
            fetch("http://127.0.0.1:8000/api/audit-document", { method: "POST", body: formData }),
            fetch("http://127.0.0.1:8000/api/brand-audit", { method: "POST", body: formData })
          ]);

          if (!complianceRes.ok) {
            const err = await complianceRes.json();
            throw new Error(`Compliance Service: ${err.detail || "Verification failed."}`);
          }
          if (!brandRes.ok) {
            const err = await brandRes.json();
            throw new Error(`Brand Service: ${err.detail || "Brand audit failed."}`);
          }

          const compData = await complianceRes.json();
          const brandData = await brandRes.json();

          setComplianceReport(compData);
          setBrandReport(brandData);
        } catch (err) {
          setError(err.message || "Failed to reach backend server.");
        } finally {
          setLoading(false);
        }
      };

      const getVerdictBadge = (verdict) => {
        switch (verdict) {
          case "VERIFIED":
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">VERIFIED</span>;
          case "CONTRADICTED":
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-950 text-rose-400 border border-rose-800">CONTRADICTED</span>;
          case "UNVERIFIED":
          default:
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-950 text-amber-400 border border-amber-800">UNVERIFIED</span>;
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-10">
          {/* Header */}
          <header className="mb-8 text-center">
            <span className="text-xs uppercase tracking-widest text-indigo-400 font-semibold bg-indigo-950/60 px-3 py-1 rounded-full border border-indigo-800/50">
              NexusMobile Audit Suite
            </span>
            <h1 className="text-3xl font-extrabold mt-3 tracking-tight">Compliance & Brand Integrity Engine</h1>
            <p className="text-slate-400 mt-2 text-sm">Automated evaluation for legal guidelines, PII leaks, brand tone, and claim verifications.</p>
          </header>

          {/* Upload Card */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl mb-8">
            <div className="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500/70 rounded-lg p-6 transition-colors">
              <input
                type="file"
                accept=".pdf"
                id="fileInput"
                className="hidden"
                onChange={handleFileChange}
              />
              <label htmlFor="fileInput" className="cursor-pointer flex flex-col items-center">
                <svg className="w-10 h-10 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <span className="text-sm font-medium text-slate-300">
                  {file ? file.name : "Select document PDF (e.g., check.pdf)"}
                </span>
                <span className="text-xs text-slate-500 mt-1">Accepts standard .pdf documents</span>
              </label>
            </div>

            <div className="mt-4 flex justify-between items-center">
              <span className="text-xs text-slate-400">
                {file ? `Selected: ${file.name}` : "No file loaded"}
              </span>
              <button
                onClick={runAudit}
                disabled={loading || !file}
                className={`px-5 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 transition-all ${
                  loading || !file
                    ? "bg-slate-800 text-slate-500 cursor-not-allowed"
                    : "bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                }`}
              >
                {loading ? (
                  <>
                    <svg className="animate-spin h-4 w-4 mr-2 text-white" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" />
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
                    </svg>
                    <span>Auditing Document...</span>
                  </>
                ) : (
                  <span>Run Complete Audit</span>
                )}
              </button>
            </div>

            {error && (
              <div className="mt-4 p-3 bg-red-950/60 border border-red-800 rounded-lg text-xs text-red-300">
                ⚠️ {error}
              </div>
            )}
          </div>

          {/* Results Display */}
          {(complianceReport || brandReport) && (
            <div className="bg-slate-900 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
              {/* Tab Navigation */}
              <div className="flex border-b border-slate-800 bg-slate-950/40">
                <button
                  onClick={() => setActiveTab("compliance")}
                  className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors ${
                    activeTab === "compliance"
                      ? "border-indigo-500 text-indigo-400 bg-slate-900/50"
                      : "border-transparent text-slate-400 hover:text-slate-200"
                  }`}
                >
                  Policy Compliance
                  {complianceReport && !complianceReport.is_compliant && (
                    <span className="ml-2 px-1.5 py-0.5 text-xs bg-rose-900/80 text-rose-300 rounded-full font-bold">!</span>
                  )}
                </button>
                <button
                  onClick={() => setActiveTab("brand")}
                  className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors ${
                    activeTab === "brand"
                      ? "border-indigo-500 text-indigo-400 bg-slate-900/50"
                      : "border-transparent text-slate-400 hover:text-slate-200"
                  }`}
                >
                  Brand & Claim Audit
                  {brandReport && brandReport.forbidden_terms && brandReport.forbidden_terms.length > 0 && (
                    <span className="ml-2 px-1.5 py-0.5 text-xs bg-amber-900/80 text-amber-300 rounded-full font-bold">
                      {brandReport.forbidden_terms.length}
                    </span>
                  )}
                </button>
              </div>

              {/* Tab 1: Compliance Audit View */}
              {activeTab === "compliance" && complianceReport && (
                <div className="p-6 space-y-6">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                    <div>
                      <h2 className="text-base font-bold text-slate-100">{complianceReport.filename}</h2>
                      <p className="text-xs text-slate-400">Database Audit Record: #{complianceReport.audit_id}</p>
                    </div>
                    <span
                      className={`text-xs px-3 py-1 font-semibold rounded-full border ${
                        complianceReport.is_compliant
                          ? "bg-emerald-950 text-emerald-300 border-emerald-800"
                          : "bg-rose-950 text-rose-300 border-rose-800"
                      }`}
                    >
                      {complianceReport.status}
                    </span>
                  </div>

                  {complianceReport.warning_triggered && (
                    <div className="p-4 bg-rose-950/40 border-l-4 border-rose-500 rounded-r-lg">
                      <h3 className="text-sm font-bold text-rose-300">Mandatory Rule Violations</h3>
                      <p className="text-xs text-slate-300 mt-1">
                        Sensitive data exposure, statutory guideline breach, or timeline discrepancy detected.
                      </p>
                    </div>
                  )}

                  <div>
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Executive Summary</h3>
                    <p className="text-sm text-slate-200 leading-relaxed bg-slate-950/60 p-3.5 rounded-lg border border-slate-800/80">
                      {complianceReport.summary}
                    </p>
                  </div>

                  {complianceReport.violations && complianceReport.violations.length > 0 && (
                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Itemized Policy Infractions</h3>
                      <div className="space-y-2">
                        {complianceReport.violations.map((violation, idx) => (
                          <div key={idx} className="p-3 bg-slate-950/50 rounded-lg border border-slate-800 text-xs text-rose-200 flex items-start space-x-2">
                            <span className="font-bold text-rose-400">•</span>
                            <span>{violation}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {complianceReport.source_references && complianceReport.source_references.length > 0 && (
                    <div className="pt-4 border-t border-slate-800">
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">RAG Context References</h3>
                      <div className="flex flex-wrap gap-2">
                        {complianceReport.source_references.map((clause, idx) => (
                          <span key={idx} className="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800/60 px-2.5 py-1 rounded-md font-mono">
                            {clause}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Tab 2: Brand & Claims Audit View */}
              {activeTab === "brand" && brandReport && (
                <div className="p-6 space-y-6">
                  {/* Persona & Tone Header */}
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                    <div>
                      <h2 className="text-base font-bold text-slate-100">Brand Persona & Terminology Assessment</h2>
                      <p className="text-xs text-slate-400">Marketing consistency & factual accuracy audit</p>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 block">Overall Tone Assessment</span>
                      <span className="text-sm font-bold text-indigo-400">{brandReport.overall_tone}</span>
                    </div>
                  </div>

                  {/* Forbidden Terms Section */}
                  {brandReport.forbidden_terms && brandReport.forbidden_terms.length > 0 ? (
                    <div>
                      <h3 className="text-xs font-semibold text-amber-400 uppercase tracking-wider mb-2">Forbidden / Unapproved Vocabulary Found</h3>
                      <div className="flex flex-wrap gap-2">
                        {brandReport.forbidden_terms.map((term, idx) => (
                          <span key={idx} className="text-xs bg-amber-950/80 text-amber-200 border border-amber-800 px-3 py-1 rounded-md font-mono">
                            "{term}"
                          </span>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <p className="text-xs text-emerald-400 bg-emerald-950/40 p-2.5 rounded-lg border border-emerald-900/60">
                      ✔ No restricted vocabulary or prohibited buzzwords identified.
                    </p>
                  )}

                  {/* Claims Breakdown Table */}
                  <div>
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Claims & Statements Breakdown</h3>
                    <div className="space-y-3">
                      {brandReport.claims_evaluation && brandReport.claims_evaluation.map((item, idx) => (
                        <div key={idx} className="bg-slate-950/60 p-4 rounded-lg border border-slate-800/80 space-y-2">
                          <div className="flex items-start justify-between gap-4">
                            <span className="text-sm font-semibold text-slate-100">"{item.claim_text}"</span>
                            {getVerdictBadge(item.verdict)}
                          </div>
                          <div className="text-xs text-slate-400">
                            <span className="text-slate-500 font-medium">Category:</span> {item.category}
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed bg-slate-900/60 p-2.5 rounded border border-slate-800/50">
                            {item.explanation}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Editorial Recommendations */}
                  {brandReport.recommendations && brandReport.recommendations.length > 0 && (
                    <div className="pt-4 border-t border-slate-800">
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Editorial Recommendations</h3>
                      <ul className="space-y-2">
                        {brandReport.recommendations.map((rec, idx) => (
                          <li key={idx} className="text-xs bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/80 text-indigo-200 flex items-start space-x-2">
                            <span className="text-indigo-400 font-bold">→</span>
                            <span>{rec}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
